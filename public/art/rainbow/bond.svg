<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" fill="none">
  <title>彩虹小队</title>
  <!-- Rounded shield silhouette: the squad's team marker, drawn as a pure white outline like the其他盟约图标 -->
  <path d="M16 2.6c3.9 2.1 7.1 3.2 10.4 3.4v10.4c0 6.1-4.2 10.9-10.4 13-6.2-2.1-10.4-6.9-10.4-13V6c3.3-.2 6.5-1.3 10.4-3.4Z"
        stroke="#fff" stroke-width="2.1" stroke-linejoin="round"/>
