org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true

android.useAndroidX=true
android.nonTransitiveRClass=true

kotlin.code.style=official

# ---------------------------------------------------------------------------------------------
# 发布签名（可选）
#
# ⚠ 口令**绝对不能**写在这个文件里：它会进版本库。按下面任一方式提供：
#   1) 环境变量 SP_KEYSTORE_PASSWORD / SP_KEY_ALIAS / SP_KEY_PASSWORD  ← 推荐（npm run dist 读这个）
#   2) 同目录下 gitignore 掉的 android/keystore.properties             ← 本地图省事
# 密钥库不存在、或口令缺失时，release 构建自动退回 debug 签名 —— 一样能侧载，只是不适合正式分发。
# ---------------------------------------------------------------------------------------------
SP_KEYSTORE=F:/android-keystore/stronghold.jks
SP_KEY_ALIAS=stronghold

# 本机客户端要反代的线上服务器（改这里就能指向别的服务器；npm run dist --upstream=… 也能覆盖）
SP_UPSTREAM=https://alliance.lingluo-toki.top

# 版本号默认从仓库根的 package.json 读（npm run dist 会显式传 -P 覆盖）。留空即可。
SP_VERSION_NAME=0.3.0-android.7-alliance
SP_VERSION_CODE=307